name: Post to public channel

on:
  # Automatic posting is ON (enabled after the manual tests in README.md "Step 3" passed).
  # GitHub cron uses UTC. India Standard Time = UTC + 5:30. Start times are approximate.
  schedule:
    - cron: "30 16 * * *"  # 16:30 UTC = 10:00 PM IST
    - cron: "30 23 * * *"  # 23:30 UTC = 5:00 AM IST (next day in India)
  # Manual runs, and the optional on-time external trigger (README: "On-time posting").
  workflow_dispatch:
    inputs:
      mode:
        description: "check = permissions only, dry-run = pick an asset without posting, report = what is left, post = really post"
        type: choice
        options: [check, dry-run, report, post]
        default: dry-run
      slot:
        description: "post only: 'auto' = the 5 AM / 10 PM slot due now, posted at most once. Empty = a one-off extra post."
        type: string
        default: ""
      channel:
        description: "Optional test channel (e.g. @my_test_channel). Empty = the public channel. Test posts are not recorded."
        type: string
        default: ""

permissions:
  contents: read
  actions: read  # read-only: look up when older GitHub runs posted an asset (for the 30-day reuse cooldown)

# Never run two posting jobs at the same time; a second one waits instead of being cancelled.
concurrency:
  group: post-to-public-channel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-poster.txt

      - name: Install dependencies
        run: pip install -r requirements-poster.txt

      - name: Run poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          PUBLIC_CHANNEL: ${{ vars.PUBLIC_CHANNEL || '@yourshakhira' }}
          CLOUDINARY_FOLDER: ${{ vars.CLOUDINARY_FOLDER || 'tgpub' }}
          POST_CAPTION: ${{ vars.POST_CAPTION }}
          POST_SELECTION: ${{ vars.POST_SELECTION }}
          # Optional captions: a rotating pool (separate entries with ||) and a footer for every post.
          POST_CAPTIONS: ${{ vars.POST_CAPTIONS }}
          POST_FOOTER: ${{ vars.POST_FOOTER }}
          # Unset = reuse: when no new media is left, repost the asset posted longest ago, but only after
          # REUSE_COOLDOWN_DAYS (default 30). Set POST_WHEN_EXHAUSTED=stop to never repeat a post.
          POST_WHEN_EXHAUSTED: ${{ vars.POST_WHEN_EXHAUSTED }}
          REUSE_COOLDOWN_DAYS: ${{ vars.REUSE_COOLDOWN_DAYS }}
          # Read-only token for the run-time lookup above (repository-scoped, expires with the job).
          GITHUB_TOKEN: ${{ github.token }}
          LOW_STOCK_THRESHOLD: ${{ vars.LOW_STOCK_THRESHOLD }}
          # Optional: your Telegram user ID (or a private admin chat) for alerts. Never the public channel.
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          # Which schedule line started this run; it identifies the slot so each slot is posted once.
          SCHEDULE_CRON: ${{ github.event.schedule }}
          POST_SLOT: ${{ inputs.slot }}
          # Scheduled runs have no inputs, so they always post.
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'post' }}
          TEST_CHANNEL: ${{ inputs.channel }}
          # Optional pause switch from the admin dashboard (its /api/public/automation URL, kept as a secret).
          # Unset or unreachable = post as normal.
          POSTER_CONTROL_URL: ${{ secrets.POSTER_CONTROL_URL }}
        run: |
          args=()
          case "$MODE" in
            check) args+=(--check) ;;
            dry-run) args+=(--dry-run) ;;
            report) args+=(--report) ;;
            post) ;;
            *) echo "Unknown mode: $MODE"; exit 2 ;;
          esac
          if [ -n "$TEST_CHANNEL" ]; then args+=(--channel "$TEST_CHANNEL"); fi
          python -m poster "${args[@]}"
