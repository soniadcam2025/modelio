name: Tests

# Runs the automated tests (fake Telegram and Cloudinary only). Uses no secrets and posts nothing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-poster.txt
            requirements-dev.txt
            requirements-dashboard.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-dashboard.txt pytest-cov

      - name: Run tests
        run: pytest -q --cov=shakhira_bot --cov=poster --cov=dashboard --cov=tools --cov-report=term-missing
